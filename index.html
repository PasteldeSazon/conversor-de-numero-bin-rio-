<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Binário Converter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Decimal/binário</h2>
    <input type="number" id="decInput" placeholder="Digite um número decimal" />
    <button onclick="converterDecParaBin()">Converter</button>

    <p class="resultado" id="resultado"></p>

    <input type="number" id="binInput" placeholder="Digite o número binário" />
    <button onclick="converterBinParaDec()">Converter</button>

    <p class="resultado" id="resultadoBinario"></p>

    <h2>Octal</h2>
    <input type="number" id="decParaOctInput" placeholder="Digite um número decimal" />
    <button onclick="converterDecParaOct()">Converter</button>

    <p class="resultado" id="resultado2"></p>

    <input type="text" id="octInput" placeholder="Digite um número octal" />

    <!-- O botão precisa chamar a função exatamente com o mesmo nome -->
    <button type="button" onclick="converterOctParaDec()">Converter</button>

    <!-- O id "resultadoOctal" deve ser idêntico ao do JavaScript -->
    <p class="resultado" id="resultadoOctal"></p>

    <h2>Hexadecimal</h2>
    <input type="number" id="decParaHexInput" placeholder="Digite um número decimal" />
    <button onclick="converterDecParaHex()">Converter</button>

    <p class="resultado" id="resultado3"></p>

    <input type="text" id="hexInput" placeholder="Digite um número Hexadecimal" />

    <!-- O botão precisa chamar a função exatamente com o mesmo nome -->
    <button onclick="converterHexParaDec()">Converter</button>

    <!-- O id "resultadoOctal" deve ser idêntico ao do JavaScript -->
    <p class="resultado" id="resultadoHexadecimal"></p>
    <!-- Esta linha abaixo vai puxar o arquivo correto -->
    <script src="script.js"></script>
  </body>
</html>
